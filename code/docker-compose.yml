# Only two containers, deliberately: Neo4j (Aura), Chroma (Cloud), and Redis
# (Upstash) are all managed cloud services you already connect to over HTTPS —
# there's nothing to containerize for them. If you ever move to self-hosted
# versions of any of those, add a service block for it here and point the
# corresponding env var at the in-network hostname instead (e.g.
# CHROMA_PERSIST_DIR pointing at a chroma service instead of Chroma Cloud).
version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped