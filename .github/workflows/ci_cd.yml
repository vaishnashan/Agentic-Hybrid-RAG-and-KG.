name: CI

on:
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Lint Python code
        run: ruff check . --exit-zero

      - name: Build API Docker image
        run: docker build -f Dockerfile.api -t nova-api .

      - name: Build UI Docker image
        run: docker build -f Dockerfile.ui -t nova-ui .